<!-- Splash de arranque (Sprint 4): tapa la pantalla mientras el backend
     confirma el token guardado. Sin sesión no se muestra nada de esto. -->
@if (cargandoInicial()) {
  <div class="splash" role="status" aria-live="polite">
    <p class="splash__marca">Identi<span class="splash__acento">Bird</span></p>
    <!-- La pluma de la marca hace de spinner: `feather.png` sale de public/. -->
    <img
      class="splash__spinner"
      src="feather.png"
      alt=""
      width="64"
      height="64"
      aria-hidden="true"
    />
    <p class="splash__texto">Cargando tu sesión…</p>
  </div>
}

<header class="cabecera">
  <div class="contenedor cabecera__contenido">
    <a class="marca" [routerLink]="auth.estaLogueado() ? '/publicaciones' : '/login'">
      <img class="marca__icono" src="identibird.png" alt="" width="38" height="38" />
      <span>Identi<span class="marca__acento">Bird</span></span>
    </a>

    <nav class="navegacion" aria-label="Navegación principal">
      @if (auth.usuarioActual(); as usuario) {
        <span class="navegacion__saludo">
          <img class="avatar avatar--chico" [src]="avatar()" alt="Tu foto de perfil" />
          <span>Hola, <strong>&#64;{{ usuario.nombreUsuario }}</strong></span>
        </span>
        <a
          class="boton boton--secundario boton--chico"
          routerLink="/publicaciones"
          routerLinkActive="activo"
        >
          Publicaciones
        </a>
        <a class="boton boton--secundario boton--chico" routerLink="/inicio" routerLinkActive="activo">
          Mi perfil
        </a>
        <button class="boton boton--primario boton--chico" type="button" (click)="salir()">Salir</button>
      } @else {
        <a class="boton boton--secundario boton--chico" routerLink="/login" routerLinkActive="activo">
          Ingresar
        </a>
        <a class="boton boton--primario boton--chico" routerLink="/registro" routerLinkActive="activo">
          Crear cuenta
        </a>
      }
    </nav>
  </div>
</header>

<main class="contenedor pantalla">
  <router-outlet />
</main>

<!-- Aviso de sesión por vencer: vive en el shell para que se vea en cualquier
     pantalla y no se pierda al navegar. Se monta recién cuando el splash
     terminó de validar el token guardado: si no, el reloj lee el `exp` del
     token antes de que el backend confirme la sesión y el modal (z-index 200)
     aparece encima del splash (z-index 100) en cada F5. -->
@if (!cargandoInicial()) {
  <app-modal-sesion />
}

<footer class="pie">
  <div class="contenedor"><strong>IdentiBird</strong> · Sprint 4 · Angular + NestJS</div>
</footer>
